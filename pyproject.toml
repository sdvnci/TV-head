[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tv-head"
version = "1.0.0"
description = "LED matrix display controller for TV Head cosplay"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Tadj Cazaubon", email = "tadj.d.cazaubon@gmail.com"}
]
keywords = ["led", "matrix", "cosplay", "opencv", "image-processing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "opencv-python>=4.5.0",
    "numpy>=1.19.0",
    "toml>=0.10.0",
]

[project.optional-dependencies]
sprites = ["pygame>=2.0.0"]
dev = [
    "pytest>=7.0.0",
    "black>=21.0.0",
    "ruff>=0.17.5",
]

[project.scripts]
tvhead = "main:main"

[project.urls]
Homepage = "https://github.com/sdvnci/TV-head"
Documentation = "https://github.com/sdvnci/TV-head/wiki"
Repository = "https://github.com/sdvnci/TV-head.git"
"Bug Tracker" = "https://github.com/sdvnci/TV-head/issues"

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
(
  /(
    # directories
    \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | build
    | dist
  )/
  # vendored from Mike Teachman's micropython-rotary
  | /onboard/Pico/rotary\.py
)
'''

[tool.ruff]
target-version = "py310"
# Vendored from Mike Teachman's micropython-rotary
extend-exclude = ["onboard/Pico/rotary.py"]

[tool.ruff.lint]
# Pinned explicitly: newer ruff releases widen the default rule set
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "onboard/common"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
